        const lockScreen = document.getElementById('jdp-lock-screen');
        const passField = document.getElementById('unlock-pass');
        const errorMsg = document.getElementById('error-msg');
        const rememberCheck = document.getElementById('remember-pass');

        // Auto Derivação de Chave AES-256-GCM
        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const baseKey = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }

        async function decryptPayload(combinedHex, password) {
            const parts = combinedHex.split(":");
            const salt = new Uint8Array(parts[0].match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const iv = new Uint8Array(parts[1].match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const encrypted = new Uint8Array(parts[2].match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const key = await deriveKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, encrypted);
            return new TextDecoder().decode(decrypted);
        }

        async function attemptUnlock() {
            const enteredPassword = passField.value.trim();
            if(!enteredPassword) return;

            try {
                const decryptedHTML = await decryptPayload(_payload, enteredPassword);
                
                // Se descriptografou com sucesso, salva no localStorage se solicitado
                if(rememberCheck.checked) {
                    localStorage.setItem('jdp_saved_key', enteredPassword);
                } else {
                    localStorage.removeItem('jdp_saved_key');
                }

                // Injeta o código descriptografado no DOM e substitui o documento inteiro
                document.open();
                document.write(decryptedHTML);
                document.close();
            } catch(err) {
                errorMsg.classList.remove('hidden');
                passField.value = "";
            }
        }

        // AUTO-LOGIN: Verifica se já existe uma chave salva localmente neste dispositivo
        window.onload = async () => {
            const savedKey = localStorage.getItem('jdp_saved_key');
            if(savedKey) {
                try {
                    const decryptedHTML = await decryptPayload(_payload, savedKey);
                    document.open();
                    document.write(decryptedHTML);
                    document.close();
                } catch(err) {
                    // Se falhar (ex: chave antiga/mudou), limpa o storage e mostra a tela de login
                    localStorage.removeItem('jdp_saved_key');
                }
            }
        };

        // Permite pressionar Enter para desbloquear
        passField.addEventListener("keypress", (e) => {
